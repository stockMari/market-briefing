# ─────────────────────────────────────────────────────────────
#  마켓 브리핑 설정 파일
#  '#' 뒤는 설명입니다. 값(콜론 오른쪽)만 바꾸면 다음 실행부터 반영됩니다.
# ─────────────────────────────────────────────────────────────

site:
  title: "Market Briefing"
  output_dir: "site"          # 완성된 웹페이지가 저장되는 폴더

# 1. 주요 지수 (순서대로 표시)
#    source: krx  → 한국거래소(pykrx)에서 가져옴
#    ticker: ...  → 야후 파이낸스(yfinance) 코드
indices:
  - { name: "KOSPI",    region: "한국", source: krx, code: "1001" }
  - { name: "KOSDAQ",   region: "한국", source: krx, code: "2001" }
  - { name: "다우",      region: "미국", ticker: "^DJI" }
  - { name: "나스닥",    region: "미국", ticker: "^IXIC" }
  - { name: "S&P500",   region: "미국", ticker: "^GSPC" }
  - { name: "닛케이225", region: "아시아", ticker: "^N225" }
  - { name: "상해종합",  region: "아시아", ticker: "000001.SS" }
  - { name: "대만가권",  region: "아시아", ticker: "^TWII" }

# 2. 투자자별 수급
flows:
  daily_trend_days: 20        # Daily: 최근 20거래일 추이
  weekly_trend_weeks: 12      # Weekly: 최근 12주 추이

# 4. 52주 신고가/신저가 판정 기준
judgment:
  individual_excess_pp: 5.0   # 종목이 섹터보다 이 값(%p) 이상 강하면 "개별 강세(개인기)" 후보
  sector_weak_pct: 0.0        # 섹터 등락률이 이 값(%) 이하면 "약한 섹터"로 봄
  high_basis: close           # 신고가 기준: close(종가) 또는 high(장중 고가)
  min_market_cap_eok: 500     # 시가총액 500억원 미만 소형주는 제외 (0이면 전체)

# 5·6. 외국인/기관 순매수 상위
top_buyers:
  count: 10                   # 상위 몇 종목까지 보여줄지

# 9. 주요 종목 신용잔고
credit:
  top_n_by_market_cap: 20     # KOSPI 시가총액 상위 몇 종목

# 나스닥 52주 신고가 · 급등주
us:
  enabled: true
  markets: [Q]                # 나스닥 시장 구분: Q 대형(Global Select) / G 중형 / S 소형
  min_price: 5                # 주가 5달러 미만 제외
  min_dollar_volume_m: 10     # 최근 20일 평균 거래대금 1천만 달러 미만 제외
  top_gainers: 15             # 급등 상위 몇 종목
  max_highs: 60               # 신고가가 많을 때 거래대금 큰 순으로 최대 몇 종목까지
  small_cap_b: 20             # 시가총액이 이 값(십억 달러, B) 미만이면 '중소형' 표시
  spark_days: 60              # 미니 그래프 기간 (거래일)

# Weekly: 앞으로 2주 일정 (금리 결정·지표·휴장일은 calendar.yaml 에서 고칩니다)
events:
  weeks: 2                    # 몇 주 앞까지 보여줄지
  show_us_monthly_opex: true  # 미국 월물 옵션 만기도 표시
  earnings:                   # 실적 발표일을 자동으로 찾을 미국 종목 (야후 코드: 이름)
    NVDA: 엔비디아
    AAPL: 애플
    MSFT: 마이크로소프트
    GOOGL: 알파벳(구글)
    AMZN: 아마존
    META: 메타
    TSLA: 테슬라
    AVGO: 브로드컴
    MU: 마이크론
    TSM: TSMC

# 7. 시장 요약 3줄
summary:
  engine: rule                # rule = 무료 자동 문장 / claude = Claude API (ANTHROPIC_API_KEY 필요, 유료)

# summary.engine 이 claude 일 때만 사용
ai:
  model: "claude-opus-5-5"    # 요약을 쓰는 Claude 모델
  effort: "medium"            # 생각하는 깊이: low / medium / high (높을수록 비용↑)

# 8. 뉴스 (4단계에서 사용, 지금은 보류)
telegram_channels: []
blogs_rss: []
news_count: { min: 5, max: 10 }
