# 마켓 브리핑 만들기 (GitHub에서 실행)
# - 자동: 평일 아침 Daily, 토요일 아침 Weekly
# - 수동: Actions → Market Briefing → Run workflow
name: Market Briefing

on:
  schedule:
    # GitHub 시간은 UTC(한국-9시간). 실제 시작이 10~20분 늦어질 수 있어 조금 일찍 잡음
    - cron: "10 22 * * 0-4"   # 월~금 07:10 KST → Daily (7:30 전후 완성)
    - cron: "40 23 * * 5"     # 토 08:40 KST → Weekly (9:00 전후 완성)
  workflow_dispatch:
    inputs:
      mode:
        description: "daily 또는 weekly"
        required: true
        default: daily
        type: choice
        options: [daily, weekly]
      date:
        description: "실행일로 볼 날짜 (YYYY-MM-DD, 비우면 오늘)"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: briefing
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - name: 실행 종류 정하기
        run: |
          MODE="${{ inputs.mode }}"
          if [ -z "$MODE" ]; then
            if [ "${{ github.event.schedule }}" = "40 23 * * 5" ]; then MODE=weekly; else MODE=daily; fi
          fi
          echo "MODE=$MODE" >> "$GITHUB_ENV"
          echo "이번 실행: $MODE"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 지난 시세 캐시 불러오기 (52주 신고가 계산용)
        uses: actions/cache@v4
        with:
          path: cache
          key: krx-cache-${{ github.run_id }}
          restore-keys: krx-cache-

      - name: 프로그램 설치
        run: pip install -r requirements.txt

      - name: 리포트 만들기
        run: |
          mkdir -p logs
          ARGS="--mode $MODE"
          if [ -n "${{ inputs.date }}" ]; then ARGS="$ARGS --date ${{ inputs.date }}"; fi
          set -o pipefail
          # pykrx 가 출력하는 로그인 아이디는 기록에서 지움
          python run.py $ARGS 2>&1 | sed -u '/로그인 ID/d' | tee logs/last-run.log

      - name: 결과 저장 (site 폴더 + 실행 기록)
        if: always()
        run: |
          git config user.name "market-briefing-bot"
          git config user.email "market-briefing-bot@users.noreply.github.com"
          # 이번에 새로 만든 리포트 숫자 파일만 따로 챙겨 두기
          mkdir -p /tmp/out/logs
          NEW=$(git status --porcelain --untracked-files=all site/data | awk '{print $2}')
          for f in $NEW; do mkdir -p /tmp/out/$(dirname $f); cp $f /tmp/out/$f; done
          cp logs/* /tmp/out/logs/ 2>/dev/null || true
          # 다른 실행이 먼저 저장했을 수 있으니 최신 상태 위에 다시 얹어서 저장 (최대 5번 시도)
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            for f in $NEW; do mkdir -p $(dirname $f); cp /tmp/out/$f $f; done
            mkdir -p logs && cp /tmp/out/logs/* logs/ 2>/dev/null || true
            python run.py --rebuild
            git add site logs
            git diff --cached --quiet && break
            git commit -q -m "briefing: $MODE $(date +%F)"
            git push -q origin HEAD:main && break
            sleep $((i * 5))
          done

  # 웹사이트 올리기 (저장소가 공개 상태일 때만)
  deploy:
    needs: build
    if: ${{ always() && !github.event.repository.private }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
